# DUDE mod cvar translation table
# ---------------------------------
# Some mods (built for stock Doom 3 or older dhewm3) reference cvars that DUDE
# has renamed or removed. Rather than fork every mod's GUI, this table
# transparently redirects reads/writes at the CVarSystem layer so mod menus
# drive DUDE's equivalent cvars.
#
# Format (one directive per line):
#
#   mod <fs_game>              Start a per-mod block. Everything below applies
#                              to that mod until the next `mod` line or EOF.
#                              Match is case-insensitive on fs_game.
#
#   alias <modCvar> <dudeCvar> Redirect ALL access to <modCvar> onto <dudeCvar>.
#                              Affects both reads and writes, from GUI script
#                              and console. Case-insensitive on <modCvar>.
#
#   autoCustomRes 1            When the mod menu's "Apply video" triggers a
#                              vid_restart, DUDE promotes r_mode to -1 so the
#                              mod's r_customWidth/Height values actually take
#                              effect (stock D3 menus often forgot this).
#
#   # ...                      Comment lines (also `//`).
#
# Runtime toggles:
#   fs_modCompatShim 0/1       master enable (default 1)
#   mods_translation_reload    re-read this file without restarting the engine
#
# Users: add your own `mod ...` blocks below. Duplicate `alias` keys in the
# same block let a later line override an earlier one, so you can override the
# defaults DUDE ships with without editing the shipped entries above.


# --- Team Future's Phobos (dhewm3 compatibility patch) -----------------------
# Phobos's video menu writes r_customWidth/Height without setting r_mode = -1,
# so picking any resolution silently falls back to 1024x768. autoCustomRes
# fixes that. The alias entries silence undefined-cvar warnings from Phobos's
# stock-era menus. Note: DUDE has no direct r_bloom equivalent yet — Phobos's
# bloom toggle is currently a no-op even with this shim. When DUDE exposes a
# bloom cvar, add an `alias r_bloom <name>` line here.
mod phobos
    autoCustomRes 1

# The dhewm3 compat patch ships as `tfphobos`, but Phobos's own scripts
# (phobos_main.script / d3xp_main.script) expect fs_game=phobos and
# fs_game_base=d3xp. Recommended launch:
#   ./run.sh +set fs_game phobos +set fs_game_base d3xp
# Rename the .so to phobos.so (or symlink) and rename/symlink the folder to
# `phobos` if you got the tfphobos-named compat package. Kept as an alias so
# either name works.
mod tfphobos
    autoCustomRes 1
