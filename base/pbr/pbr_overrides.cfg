# DUDE PBR per-material overrides (docs/pbr-materials.md Phase B)
#
# Hand-authored corrections on top of the generated pbr_materials.cfg — entries
# here always win. Format, one per line:
#
#   <material name> <metalness> <roughness>
#
#   metalness: 0 = dielectric (stone, plastic, wood, skin), 1 = metal.
#              The effective value is clamped by r_pbrMetalnessMax.
#   roughness: 0.03 = mirror .. 1.0 = fully matte.
#
# Tuning workflow (in-game, r_pbr 1):
#   1. aim at the surface and use r_showSurfaceInfo 1 to read its material name
#   2. add/edit the line here
#   3. run `reloadPbrTable` in the console — applies instantly, no restart
#
# Example (commented out):
#   textures/base_wall/cpuwall2b 1.0 0.25   # make this panel a cleaner steel
#
# For the d3xp expansion, create d3xp/pbr/pbr_overrides.cfg alongside its
# generated table.

# Steel floor plate straggler: its siblings (sflpanel1..8) classify as bare
# metal via the sflpanel token, but this one borrows a_skpanel5_local as its
# bump map, and that extra "panel" word outvotes the steel token into
# painted->ceramic. One-off, so pinned here rather than special-cased in the
# classifier. Values match the metal category defaults (1.0 / 0.32).
textures/base_floor/a_sflpanel4a_01 1.0 0.32
