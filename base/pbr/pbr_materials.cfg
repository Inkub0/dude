# DUDE PBR material config (docs/pbr-materials.md) — the main, authored table.
#
# Bootstrapped by tools/pbr_classify.py, then hand-tuned in-game with the material
# editor (editPbrMaterial) and baked in here. Loaded first; the per-game
# pbr/pbr_overrides.cfg loads on top and wins on collision. This is the shippable
# base config — running pbr_classify.py again regenerates a fresh classifier
# baseline and DISCARDS the hand-tuning below, so fold overrides in instead:
#   python3 tools/pbr_bake_inplace.py      (in place; keeps the @cat rows)
#
# Columns: <material> <metalness> <roughness> <category> <wetness> <env>
# '*' = inherit: a categorized row tracks its class's live preset (the @cat rows,
# tuned in the Categories panel); category 'none' pins the row's explicit numbers.
# Classes are Quake 4's materialType names (solidmetal, hollowmetal, concrete, rock,
# flesh, glass...) plus DUDE's skin, eyes, ceramic, rust, wood, cloth, cardboard -
# one vocabulary for every title (docs/pbr-materials.md). The old Doom 3 names
# (metal, metal_painted, ceramic_sheen, metal_rust, stone, liquid) still load as
# aliases in older override files.


# ---- solidmetal ----
# ---- category defaults (baked from overrides) ----
@cat ceramic 0.020 0.350 2.400 0.000
@cat eyes 0.000 0.150 1.000 1.000
@cat flesh 0.000 0.420 1.420 0.000
@cat solidmetal 0.500 0.450 0.400 0.900
@cat hollowmetal 0.320 0.420 1.000 0.800
@cat rust 0.540 0.490 0.280 0.000
@cat skin 0.000 0.440 2.000 0.000
@cat concrete 0.000 0.900 1.000 1.000
@cat rock 0.000 0.900 1.000 1.000
@cat dirt 0.000 0.900 1.000 1.000
@cat sand 0.000 0.900 1.000 1.000
@cat gravel 0.000 0.900 1.000 1.000
@cat monstermetal 0.540 0.460 0.400 0.900
@cat armor 0.100 0.500 1.000 1.000
@cat electronics 0.200 0.400 1.000 1.000
@cat plastic 0.000 0.450 1.000 1.000
@cat rubber 0.000 0.700 1.000 1.000
@cat glass 0.000 0.050 1.000 1.000
@cat bpglass 0.000 0.050 1.000 1.000
@cat water 0.000 0.150 1.000 1.000
@cat oil 0.000 0.100 1.000 1.000
@cat gelatinousfluid 0.000 0.200 1.000 1.000
@cat wood 0.000 0.750 1.000 1.000
@cat cloth 0.000 0.850 1.000 1.000
@cat cardboard 0.000 0.850 1.000 1.000
