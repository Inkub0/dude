# DUDE PBR per-game table for Resurrection of Evil (docs/pbr-materials.md section 6), shipped.
#
# RoE has no pbr_materials.cfg of its own: it inherits base/pbr/pbr_materials.cfg through the
# VFS fallback. This file holds only what differs: RoE-only materials plus deliberate RoE edits.
# The Lost Mission reads it too (fs_game_base d3xp).
# Load order: pbr_materials.cfg, then this file, then pbr/pbr_overrides.cfg (the in-game
# editor's deltas in the dude folder), each later file winning on collision. Editor saves
# never touch this file, so they cannot hide it. Fold RoE editor deltas in with:
#   tools/pbr_bake_inplace.py --table d3xp/pbr/pbr_game.cfg --overrides <dude folder>/d3xp/pbr/pbr_overrides.cfg --reset
#
# Columns: <material> <metalness> <roughness> <category> <wetness> <env>; '*' = inherit.


